*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

.topnav{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:2px 0 4px}
.topnav a{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;border:1px solid rgba(215,180,101,.45);background:rgba(215,180,101,.07);color:#F6E3AE;text-decoration:none}

header{display:flex;align-items:center;gap:10px;padding:12px 0 6px}
header a.home{display:block;flex-shrink:0;line-height:0}

header .ttl{flex:1}
header h1{font-size:24px;font-weight:700;line-height:1.5;padding-bottom:.12em}
header .sub{font-size:12px;color:var(--gold);font-weight:600;line-height:1.6;margin-top:2px}
.card{background:linear-gradient(165deg,var(--navy2),rgba(7,29,43,.9));border:1px solid rgba(255,245,229,.08);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
/* المشغل */
.player{text-align:center;border-color:rgba(215,180,101,.35)}
.cover{position:relative;width:min(240px,64vw);aspect-ratio:1;margin:4px auto 14px;border-radius:24px;overflow:hidden;
 background:radial-gradient(circle at 30% 20%,rgba(240,217,154,.30),transparent 60%),linear-gradient(160deg,#16405A,#0A2232);border:1.5px solid rgba(215,180,101,.55);box-shadow:0 18px 40px rgba(0,0,0,.45);display:grid;place-items:center}
.cover img.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover img.main{width:62%;height:62%;object-fit:contain;filter:drop-shadow(0 8px 16px rgba(0,0,0,.4))}
.cover .ring{position:absolute;inset:10px;border-radius:18px;border:1px dashed rgba(215,180,101,.25)}
.cover .eq{position:absolute;top:10px;left:10px;display:flex;gap:3px;align-items:flex-end;height:26px;padding:5px 7px;border-radius:9px;background:rgba(7,29,43,.75);opacity:0;transition:opacity .3s}
.playing .cover .eq{opacity:1}
.eq i{width:3px;background:var(--gold);border-radius:2px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}.eq i:nth-child(5){animation-delay:.3s}
@keyframes eq{0%,100%{height:4px}50%{height:16px}}
.player h2{font-size:26px;font-weight:700}
.player .s2{font-size:13px;color:var(--gold);font-weight:600;margin-top:2px}
.bar{margin:16px 2px 4px;direction:ltr}
.bar input{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:4px;background:linear-gradient(90deg,var(--gold) var(--p,0%),rgba(255,245,229,.15) var(--p,0%));outline:0}
.bar input::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--gold2);border:2px solid var(--navy);box-shadow:0 0 0 2px var(--gold)}
.bar input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--gold2);border:2px solid var(--navy)}
.times{display:flex;justify-content:space-between;font-size:11.5px;opacity:.6;direction:ltr;padding:0 2px}
.ctl{display:flex;align-items:center;justify-content:center;gap:22px;margin:10px 0 4px}
.ctl .sm{width:44px;height:44px;border-radius:50%;border:1px solid rgba(215,180,101,.35);background:rgba(215,180,101,.06);display:grid;place-items:center;color:var(--gold2)}
.ctl .sm svg{width:20px;height:20px;fill:currentColor}
.ctl .pp{width:74px;height:74px;border-radius:50%;border:0;background:linear-gradient(180deg,#F6E3AE,#D7B465 55%,#B08A3E);color:var(--navy);display:grid;place-items:center;box-shadow:0 10px 24px rgba(215,180,101,.25)}
.ctl .pp svg{width:30px;height:30px;fill:currentColor}

.btn.main{background:linear-gradient(180deg,#F6E3AE,#D7B465 55%,#B08A3E);color:var(--navy);border:0}
.btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn[aria-disabled=true]{opacity:.45;pointer-events:none}
/* الكلمات */
.lyr summary{list-style:none;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px;cursor:pointer}
.lyr summary::-webkit-details-marker{display:none}

.lyr[open] summary::after{transform:rotate(225deg) translateY(-3px)}
.lyr .txt{margin-top:12px;white-space:pre-line;line-height:2.05;font-size:15px;text-align:center;opacity:.92}
.lyr .txt b{color:var(--gold2)}

.h3{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--gold);margin:18px 2px 10px}

.clubs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 9px;border-radius:16px;border:1px solid rgba(255,245,229,.08);background:rgba(255,245,229,.03);font-size:11.5px;font-weight:600}
.clubs button img{height:38px;width:auto;max-width:44px;object-fit:contain}
.clubs button.on{border-color:var(--gold);background:rgba(215,180,101,.10);box-shadow:inset 0 0 0 1px rgba(215,180,101,.4)}
.soonrow{margin-top:12px;text-align:center;font-size:12.5px;opacity:.75}.soonrow div{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:8px}.soonrow img{width:24px;height:24px;object-fit:contain;opacity:.5}
.clubs button.soon{opacity:.38;cursor:default}
.clubs button.soon::after{content:'قريباً';font-size:9px;opacity:.8;margin-top:-3px}
.clubs button.has::after{content:'♪';position:absolute;top:4px;left:7px;color:var(--gold);font-size:13px}
.dl-note{font-size:11.5px;opacity:.6;text-align:center;margin-top:8px}
.ov{position:fixed;inset:0;background:rgba(2,9,15,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:460px;margin:0 10px calc(10px + env(safe-area-inset-bottom));border-radius:26px;padding:18px 16px 14px;background:linear-gradient(170deg,#173F58,#0B2434 75%);border:1px solid rgba(215,180,101,.45);box-shadow:0 -10px 40px rgba(0,0,0,.5);transform:translateY(30px);transition:transform .3s}
.ov.on .sheet{transform:none}
.sheet h3{margin:0 0 4px;font-size:17px;text-align:center}
.sheet .q{font-size:13px;opacity:.7;text-align:center;margin-bottom:14px}
.opt{width:100%;display:flex;align-items:center;gap:12px;padding:13px 14px;margin-bottom:10px;border-radius:18px;border:1px solid rgba(255,245,229,.12);background:rgba(255,245,229,.05);color:inherit;font:inherit;text-align:right;cursor:pointer}
.opt i{font-style:normal;font-size:26px;width:34px;text-align:center}
.opt b{display:block;font-size:15.5px}.opt small{display:block;font-size:12px;opacity:.65;margin-top:2px}
.opt.busy{opacity:.6}.opt.ready{border-color:var(--gold);background:rgba(215,180,101,.14)}
.cancel{width:100%;padding:12px;border:0;border-radius:16px;background:transparent;color:var(--gold);font:inherit;font-weight:700;cursor:pointer}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-120px);background:var(--gold);color:var(--navy);font-weight:700;padding:10px 18px;border-radius:30px;z-index:40;transition:transform .3s;white-space:nowrap;font-size:14px}
.toast.on{transform:translateX(-50%) translateY(0)}
.empty{padding:26px 10px;text-align:center;opacity:.7;line-height:1.9}
footer{text-align:center;font-size:12px;opacity:.6;margin:22px 0 4px;line-height:1.9}
footer .sadu{width:90px;margin:0 auto 10px}
footer a{color:var(--gold);text-decoration:none}
</style>

<body>
<div class="toast" id="toast"></div>
<div class="ov" id="dlOv"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dlT">
 <h3 id="dlT"></h3><div class="q">وين تبا تحفظها؟</div>
 <button class="opt" data-k="v"><i>🖼️</i><span><b>في الاستديو</b><small>فيديو بغلاف الأغنية، يشتغل من الصور</small></span></button>
 <button class="opt" data-k="a"><i>📁</i><span><b>في الملفات</b><small>ملف صوت MP3</small></span></button>
 <button class="cancel" id="dlX">إلغاء</button>
</div></div>
<div class="wrap">
  <nav class="topnav" aria-label="التنقل">

  </nav>
  <header>
    <a class="home" href="../" aria-label="منصة العازي"><img class="logo" src="../mano/assets/logo.png" alt="العازي"></a>

  </header>
  <div class="sadu" aria-hidden="true"></div>
  <main id="app"><div class="empty">لحظة...</div></main>
  <footer><div class="sadu" aria-hidden="true"></div>من <a href="https://x.com/el3azy22" target="_blank" rel="noopener" dir="ltr">@el3azy22</a> · <a href="../">منصة العازي</a></footer>
</div>
<audio id="au" preload="none"></audio>
<script>
(()=>{
const $=s=>document.querySelector(s);
const CL={ain:'العين',wahda:'الوحدة',jazira:'الجزيرة',shababahli:'شباب الأهلي',sharjah:'الشارقة',wasl:'الوصل',nasr:'النصر',baniyas:'بني ياس',ajman:'عجمان',kalba:'كلباء',khorfakkan:'خورفكان',dhafra:'الظفرة',hatta:'حتا',united:'يونايتد'};
const ORDER=['ain','wahda','jazira','shababahli','sharjah','wasl','nasr','baniyas','ajman','kalba','khorfakkan','dhafra','hatta','united'];
const SITE='https://el3azy.com/songs/';
const gc=n=>{try{window.goatcounter&&window.goatcounter.count&&window.goatcounter.count({path:n,title:n,event:true})}catch(e){}};
let toastT;const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2000)};
const fmt=s=>!isFinite(s)?'0:00':Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IC={play:'<svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>',pause:'<svg viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>',
 back:'<svg viewBox="0 0 24 24"><path d="M11 6 4 12l7 6zM20 6l-7 6 7 6z"/></svg>',fwd:'<svg viewBox="0 0 24 24"><path d="M13 6l7 6-7 6zM4 6l7 6-7 6z"/></svg>',
 dl:'<svg viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 19.5h14"/></svg>'};
const au=$('#au');let S=[],cur=null;
const cover=s=>s.cover?'./'+s.cover:s.club?`../mano/assets/${s.club}.png`:'../mano/assets/logo.png';
const file=s=>s.file?'./'+s.file:'';
const PLAYED={}; // «تشغيل» ينحسب مرة وحدة لكل أغنية في كل زيارة (الإيقاف والرجوع ما يزيد العدد)
const dlName=s=>`${s.title} - العازي.mp3`;

fetch('songs.json?v='+Date.now().toString().slice(0,-5)).then(r=>r.json()).then(d=>{S=d.songs||[];
  const want=new URLSearchParams(location.search).get('s');
  cur=S.find(x=>x.id===want)||S[0];render()}).catch(()=>{$('#app').innerHTML='<div class="card empty">ما قدرنا نحمّل الأغاني. حدّث الصفحة 🔄</div>'});

function render(){
  const s=cur,ready=!!s.file;
  const byClub={};S.forEach(x=>{if(x.club)byClub[x.club]=x});
  const league=S.filter(x=>!x.club);
  $('#app').innerHTML=`
  <div class="card player" id="pl">
    <div class="cover">${s.cover?`<img class="art" src="${cover(s)}" alt="">`:`<span class="ring"></span><img class="main" src="${cover(s)}" alt="">`}<span class="eq"><i></i><i></i><i></i><i></i><i></i></span></div>
    <h2>${esc(s.title)}</h2><div class="s2">${esc(s.sub)}</div>
    <div class="bar"><input type="range" id="seek" min="0" max="1000" value="0" aria-label="مكان الأغنية" ${ready?'':'disabled'}></div>
    <div class="times"><span id="tc">0:00</span><span id="td">${s.dur?fmt(s.dur):'--:--'}</span></div>
    <div class="ctl">
      <button class="sm" id="fw" aria-label="قدّم 10 ثواني">${IC.fwd}</button>
      <button class="pp" id="pp" aria-label="شغّل" ${ready?'':'disabled'}>${IC.play}</button>
      <button class="sm" id="bk" aria-label="رجّع 10 ثواني">${IC.back}</button>
    </div>
    <div class="acts">
      <a class="btn main" id="dl" href="${file(s)}" download="${esc(dlName(s))}" aria-disabled="${!ready}">${IC.dl} نزّل الأغنية</a>
      <button class="btn" id="sh">𝕏 شاركها</button>
    </div>
    ${ready?'':'<div class="dl-note">الأغنية تنزل هني قريب</div>'}
  </div>
  ${s.lyrics?`<details class="card lyr"><summary>📝 الكلمات</summary><div class="txt">${esc(s.lyrics).replace(/\*(.+?)\*/g,'<b>$1</b>')}</div></details>`:''}
  ${league.length>1?`<div class="h3">🎵 أغاني الدوري</div>`+league.map(x=>`<button class="card" data-id="${x.id}" style="width:100%;text-align:right;display:flex;gap:10px;align-items:center"><img src="${cover(x)}" style="height:40px" alt=""><b>${esc(x.title)}</b></button>`).join(''):''}
  <div class="h3">🏟️ أغاني الأندية</div>
  ${ORDER.some(k=>byClub[k])?`<div class="clubs">${ORDER.filter(k=>byClub[k]).map(k=>{const x=byClub[k];return `<button class="${x===cur?'on has':'has'}" data-id="${x.id}"><img src="../mano/assets/${k}.png" alt="">${CL[k]}</button>`}).join('')}</div>`:''}
  ${ORDER.some(k=>!byClub[k])?`<div class="soonrow"><span>أغاني باقي الأندية قريباً</span><div>${ORDER.filter(k=>!byClub[k]).map(k=>`<img src="../mano/assets/${k}.png" alt="${CL[k]}" title="${CL[k]}">`).join('')}</div></div>`:''}
  ${cur.club?`<button class="btn" id="toLeague" style="width:100%;margin-top:12px">🎵 ارجع لأغنية «دورينا»</button>`:''}`;
  bind();
}

/* التنزيل: نافذة «وين تبا تحفظها؟»
   آيفون: ورقة المشاركة من النظام (الفيديو فيها «حفظ الفيديو» للاستديو، والـMP3 فيه «حفظ في الملفات»).
   باقي الأجهزة: تنزيل مباشر (الفيديو يطلع في المعرض، والـMP3 في التنزيلات). */
const IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const BLOB={};let dlS=null;
const vidOf=s=>s.file.replace(/\.mp3$/,'.mp4');
function openDl(s){dlS=s;$('#dlT').textContent='⬇️ نزّل «'+s.title+'»';document.querySelectorAll('#dlOv .opt').forEach(o=>{o.classList.remove('busy','ready');o.querySelector('small').textContent=o.dataset.k==='v'?'فيديو بغلاف الأغنية، يشتغل من الصور':'ملف صوت MP3'});$('#dlOv').classList.add('on')}
function closeDl(){$('#dlOv').classList.remove('on')}
async function saveAs(k,btn){
  const s=dlS;if(!s)return;const f=k==='v'?vidOf(s):s.file,name=dlName(s).replace(/\.mp3$/,k==='v'?'.mp4':'.mp3'),key=s.id+k;
  if(!IOS||!navigator.canShare){const a=document.createElement('a');a.href='./'+f;a.download=name;document.body.appendChild(a);a.click();a.remove();gc('dl-'+s.id);window.el3stat&&el3stat(s.id,'dl');closeDl();toast('⬇️ '+(k==='v'?'الفيديو':'الأغنية')+' تنزل الحين');return}
  if(!BLOB[key]){btn.classList.add('busy');btn.querySelector('small').textContent='لحظة، نجهزها…';
    try{const b=await (await fetch('./'+f)).blob();BLOB[key]=new File([b],name,{type:k==='v'?'video/mp4':'audio/mpeg'})}catch(e){btn.classList.remove('busy');toast('ما قدرنا نجهزها، جرّب مرة ثانية');return}
    btn.classList.remove('busy')}
  const file=BLOB[key];
  if(!navigator.canShare({files:[file]})){const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;a.click();gc('dl-'+s.id);window.el3stat&&el3stat(s.id,'dl');closeDl();return}
  try{await navigator.share({files:[file]});gc('dl-'+s.id);window.el3stat&&el3stat(s.id,'dl');closeDl()}
  catch(e){if(e&&e.name==='AbortError')return; // آيفون يطلب ضغطة جديدة لو التجهيز طوّل
    btn.classList.add('ready');btn.querySelector('small').textContent='✓ جاهزة، اضغط مرة ثانية واختر '+(k==='v'?'«حفظ الفيديو»':'«حفظ في الملفات»')}
}
document.querySelectorAll('#dlOv .opt').forEach(o=>o.onclick=()=>saveAs(o.dataset.k,o));
$('#dlX').onclick=closeDl;$('#dlOv').onclick=e=>{if(e.target.id==='dlOv')closeDl()};
function bind(){
  const s=cur;
  document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const x=S.find(y=>y.id===b.dataset.id);if(!x||x===cur)return;pick(x,true)});
  const tl=$('#toLeague');if(tl)tl.onclick=()=>pick(S.find(x=>!x.club),true);
  document.querySelectorAll('.clubs .soon').forEach(b=>b.onclick=()=>toast('أغنية '+b.textContent.trim()+' قريباً 🎶'));
  $('#pp').onclick=()=>{if(!s.file)return;if(au.paused){if(au.dataset.id!==s.id){au.src=file(s);au.dataset.id=s.id}au.play().catch(()=>toast('ما قدرنا نشغلها، جرّب مرة ثانية'));if(!PLAYED[s.id]){PLAYED[s.id]=1;gc('play-'+s.id);window.el3stat&&el3stat(s.id,'play')}}else au.pause()};
  $('#bk').onclick=()=>{if(au.dataset.id===s.id)au.currentTime=Math.max(0,au.currentTime-10)};
  $('#fw').onclick=()=>{if(au.dataset.id===s.id&&au.duration)au.currentTime=Math.min(au.duration-.5,au.currentTime+10)};
  $('#seek').oninput=e=>{if(au.dataset.id!==s.id){au.src=file(s);au.dataset.id=s.id}const go=()=>{au.currentTime=e.target.value/1000*au.duration};au.duration?go():au.addEventListener('loadedmetadata',go,{once:true})};
  $('#dl').onclick=e=>{e.preventDefault();if(s.file)openDl(s)};
  $('#sh').onclick=share;
  ui();
}
function pick(x,play){au.pause();cur=x;history.replaceState(null,'',x===S[0]?location.pathname:'?s='+x.id);render();scrollTo({top:0,behavior:'smooth'});if(play&&x.file)$('#pp').click()}
async function share(){
  const s=cur,url=SITE+(s.file?s.id+'/':'?s='+s.id); // صفحة الأغنية الخاصة: معاينة X بغلافها وشعار ناديها
  const text=`🎵 ${s.title}${s.club?' — '+CL[s.club]:' — أغنية دوري أدنوك للمحترفين'}\nاسمعها ونزّلها مجاناً 👇\n${url}`;
  gc('share-'+s.id);window.el3stat&&el3stat(s.id,'share');
  if(navigator.share){try{await navigator.share({text});return}catch(e){if(e&&e.name==='AbortError')return}}
  window.open('https://x.com/intent/post?text='+encodeURIComponent(text),'_blank');
}
function ui(){
  const mine=au.dataset.id===cur.id,pl=$('#pl');if(!pl)return;
  const playing=mine&&!au.paused;pl.classList.toggle('playing',playing);
  $('#pp').innerHTML=playing?IC.pause:IC.play;$('#pp').setAttribute('aria-label',playing?'وقّف':'شغّل');
  if(mine&&au.duration){const p=au.currentTime/au.duration*100;$('#seek').value=Math.round(p*10);$('#seek').style.setProperty('--p',p+'%');$('#tc').textContent=fmt(au.currentTime);$('#td').textContent=fmt(au.duration)}
  else{$('#seek').value=0;$('#seek').style.setProperty('--p','0%');$('#tc').textContent='0:00'}
}
['play','pause','timeupdate','loadedmetadata','ended'].forEach(e=>au.addEventListener(e,ui));
au.addEventListener('play',()=>{if('mediaSession' in navigator){const s=cur;navigator.mediaSession.metadata=new MediaMetadata({title:s.title,artist:'العازي · منصة العازي',album:'أغاني دورينا وأنديتنا',artwork:[{src:new URL(cover(s),location.href).href,sizes:'512x512',type:'image/png'}]})}});
if('mediaSession' in navigator){navigator.mediaSession.setActionHandler('play',()=>au.play());navigator.mediaSession.setActionHandler('pause',()=>au.pause())}
})();
</script>
