# «قيّم اللاعبين»: يسحب التشكيلات والتبديلات والنتايج من موقع اتحاد الكرة وينشر rate/data.json
name: rate-data
on:
  schedule:
    - cron: '*/10 11-21 * * *'   # 3 العصر لين 2 الفجر بتوقيت الإمارات: كل 10 دقايق (وقت المباريات)
    - cron: '17 3 * * *'          # مرة الصبح لتحديث قائمة المباريات
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rate-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python3 _tools/rate/build.py
      - name: commit
        run: |
          git config user.name "el3azy-bot"
          git config user.email "el3azy-bot@users.noreply.github.com"
          git add rate/data.json rate/p
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "قيّم اللاعبين: تحديث المباريات" -q
          git pull --rebase -q && git push -q
