# «قيّم اللاعبين» + «دوري التوقعات» + «دوري الجماهير»: يسحب المباريات والنتايج من موقع اتحاد الكرة وينشر rate/data.json و predict/*.json
# GitHub يأخّر الجداول (*/10 كانت تشتغل تقريباً مرة بالساعة)، فكل تشغيل في وقت المباريات
# يظل شغّال لين ~3 ساعات ويسحب البيانات كل 8 دقايق. التشغيلات الجاية تنتظر في الطابور وتكمّل وراه، فما في فراغ.
name: rate-data
on:
  schedule:
    - cron: '7 11-21 * * *'    # 3 العصر لين 2 الفجر بتوقيت الإمارات (كل تشغيل يلف لحاله كل 8 دقايق)
    - cron: '17 3 * * *'       # مرة الصبح لتحديث قائمة المباريات
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rate-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow google-auth requests
      # «باص الفريق»: المُعيد يحتاج متصفح، وينثبت بس لو الباص انطلق في الدوري (bus/config.json start)
      - name: bus verifier deps
        run: |
          if python3 -c "import json,sys;sys.exit(0 if json.load(open('bus/config.json')).get('start') else 1)"; then
            pip install playwright && python -m playwright install --with-deps chromium && echo "BUS=1" >> $GITHUB_ENV
          fi
      - name: loop
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          git config user.name "el3azy-bot"
          git config user.email "el3azy-bot@users.noreply.github.com"
          start=$(date -u +%s)
          h=$(date -u +%H)
          # نهاية وقت المباريات = 22:05 UTC (2:05 الفجر بتوقيت الإمارات)، وأقصى مدة للتشغيل 175 دقيقة
          win_end=$(date -u -d "today 22:05" +%s)
          deadline=$(( start + 175*60 ))
          [ "$win_end" -lt "$deadline" ] && deadline=$win_end
          # برا وقت المباريات (تشغيل الصبح أو يدوي): مرة وحدة بس
          if [ "$h" -lt 11 ] || [ "$h" -ge 22 ]; then deadline=$start; fi
          while :; do
            # نحدّث الكود كل دورة: التشغيل يطول 3 ساعات، وبدون هذا ينشر قواعد Firebase قديمة فوق الجديدة ويتعارض مع أي رفع
            git pull --rebase -q || { git rebase --abort 2>/dev/null; git reset -q --hard origin/main; git pull -q || true; }
            python3 _tools/rate/build.py || echo "::warning::build.py فشل في هالدورة"
            python3 _tools/predict/build.py || echo "::warning::predict فشل في هالدورة"
            python3 _tools/firebase/deploy.py || echo "::warning::نشر القواعد فشل في هالدورة"
            [ -n "$BUS" ] && { python3 _tools/bus/verify.py || echo "::warning::مُعيد الباص فشل"; }
            python3 _tools/fans/build.py || echo "::warning::دوري الجماهير فشل في هالدورة"
            git add rate/data.json rate/p tashkila/lineups.json khamsa/stats.json predict/data.json predict/table.json _tools/predict/cache _tools/firebase/rules.json predict/lock.json predict/open.json setup/rules.html fans/data.json fans/acc.json fans/ranks.json fans/tp.json fans/geo.json
            if ! git diff --cached --quiet; then
              git commit -m "قيّم اللاعبين + دوري التوقعات: تحديث المباريات" -q
              git pull --rebase -q && git push -q || echo "::warning::push فشل في هالدورة"
            fi
            now=$(date -u +%s)
            [ $(( now + 8*60 )) -ge "$deadline" ] && break
            sleep 480
          done
