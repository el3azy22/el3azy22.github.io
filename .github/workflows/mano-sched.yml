# مرة وحدة (يدوي): ينقل جدول «لاعب اليوم» لـ Firebase (q) ويعيد ترتيب الأيام الياية ويشيل الجدول من mano/data.json
name: mano-sched
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-auth requests
      - env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          git config user.name "el3azy-bot"
          git config user.email "el3azy-bot@users.noreply.github.com"
          python3 _tools/mano/sched.py push
          git add mano/data.json
          git commit -m "منو اللاعب: الجدول انتقل لـFirebase (مخفي لين يومه)" -q
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 10; done
