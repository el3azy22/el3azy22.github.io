# «باص الفريق»: تشغيل المُعيد يدوياً (للتجربة قبل الإطلاق). بعد الإطلاق يشتغل بروحه مع تحديث دوري الجماهير.
name: bus-verify
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-auth requests playwright && python -m playwright install --with-deps chromium
      - env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: python3 _tools/bus/verify.py
