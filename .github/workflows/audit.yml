# مراجعة يدوية: أعداد مجمعة بس (بدون معرفات)
name: audit
on: workflow_dispatch
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q google-auth requests
      - env: {FIREBASE_SA: '${{ secrets.FIREBASE_SA }}'}
        run: python3 _tools/audit/mano_audit.py
