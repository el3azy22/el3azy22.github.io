# «دوري الجماهير»: بعد نهاية كل جولة (الثلاثاء 12:40 بالليل بتوقيت الإمارات) يحسب الجدول ويصوّر صورة الأسبوع (fans/week.png) للاستوديو
name: fans-week
on:
  schedule:
    - cron: '40 20 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fans-week
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow google-auth requests playwright && python -m playwright install --with-deps chromium
      - name: build + render
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          git config user.name "el3azy-bot"
          git config user.email "el3azy-bot@users.noreply.github.com"
          python3 _tools/fans/build.py
          python3 _tools/fans/render.py
          git add fans/data.json fans/week.png fans/week.json fans/og.jpg
          if ! git diff --cached --quiet; then
            git commit -m "دوري الجماهير: جدول الجولة وصورة الأسبوع" -q
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 10; done
          fi
