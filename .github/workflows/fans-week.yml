# «دوري الجماهير»: بعد نهاية كل جولة (الثلاثاء 12:40 بالليل بتوقيت الإمارات) يحسب الجدول ويصوّر صورة الأسبوع (fans/week.png) للاستوديو
name: fans-week
on:
  schedule:
    - cron: '40 20 * * 1'
  workflow_dispatch:
    inputs:
      now:
        description: 'للتجربة بس: وقت بالملي ثانية (ما يرفع شي)'
        required: false
permissions:
  contents: write
concurrency:
  group: fans-week
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow google-auth requests playwright && python -m playwright install --with-deps chromium
      - name: build + render
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          NOW: ${{ inputs.now }}
        run: |
          git config user.name "el3azy-bot"
          git config user.email "el3azy-bot@users.noreply.github.com"
          python3 _tools/fans/build.py
          python3 _tools/fans/render.py
          if [ -n "$NOW" ]; then ls -la fans; python3 -c "import json;d=json.load(open('fans/data.json'));print('cur',d['cur'],'done',d['done'],'names',d['names'],[w['stars'] for w in d['weeks']])"; exit 0; fi
          git add fans
          if ! git diff --cached --quiet; then
            git commit -m "دوري الجماهير: جدول الجولة وصورة الأسبوع" -q
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 10; done
          fi
