<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>@font-face{font-family:R;src:url(/tashkila/assets/ReadexPro.ttf) format('truetype');font-weight:160 700}
body{margin:0;width:1080px;height:1080px;font-family:R;color:#FFF5E5;overflow:hidden;position:relative;background:#071D2B}
.bg{position:absolute;inset:0}
.f{position:absolute;inset:22px;border:2px solid rgba(215,180,101,.45);border-radius:40px}
.stripe{position:absolute;left:-10%;right:-10%;height:120px;transform:rotate(-12deg);opacity:.9}
.crest{position:absolute;left:50%;top:330px;transform:translate(-50%,-50%);filter:drop-shadow(0 18px 30px rgba(0,0,0,.55))}
.disc{position:absolute;left:50%;top:330px;width:400px;height:400px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(7,29,43,.92) 58%,rgba(7,29,43,0) 72%)}
.t{position:absolute;left:0;right:0;top:600px;text-align:center}
.k{color:#D7B465;font-size:40px;font-weight:600}
h1{margin:6px 0 0;font-size:150px;line-height:1.1;font-weight:700;background:linear-gradient(180deg,#F6E3AE,#D7B465 60%,#B08A3E);-webkit-background-clip:text;color:transparent}
.n{font-size:46px;font-weight:600;margin-top:8px}
.b{position:absolute;bottom:62px;left:0;right:0;text-align:center;font-size:30px;opacity:.75}
</style></head><body>
<div class="bg" id="bg"></div><div class="f"></div><div class="disc"></div><img class="crest" id="cr">
<div class="t"><div class="k">♪ أغنية</div><h1 id="nm"></h1><div class="n" id="nk"></div></div>
<div class="b">العازي · el3azy.com/songs</div>
<script>
const q=new URLSearchParams(location.search),c=q.get('club'),c1=q.get('c1'),c2=q.get('c2');
const CR={jazira:[1,1],wasl:[.973,1.165]};const f=CR[c]||[1,1];
document.getElementById('cr').src='/mano/assets/'+c+'.png';document.getElementById('cr').style.width=300*f[0]+'px';document.getElementById('cr').style.height=300*f[1]+'px';
document.getElementById('nm').textContent=q.get('name');document.getElementById('nk').textContent='«'+q.get('nick')+'»';
document.getElementById('bg').style.background=`radial-gradient(ellipse at 50% 30%,${c1}55,transparent 60%),radial-gradient(ellipse at 85% -5%,rgba(215,180,101,.22),transparent 50%),radial-gradient(ellipse at 10% 105%,${c2}66,transparent 55%),#071D2B`;
</script></body></html>
